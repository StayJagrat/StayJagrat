name: Generate Contribution Snake

on:
schedule:
- cron: "0 0 * * *"

workflow_dispatch:

push:
branches:
- main

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest
timeout-minutes: 10

```
steps:
  - name: Generate contribution snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: ${{ github.repository_owner }}
      outputs: |
        dist/github-contribution-grid-snake.svg?color_snake=%23ffd43b&color_dots=%23ebedf0,%23fff0a6,%23ffe066,%23ffd43b,%23b89400
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ffd43b
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  - name: Publish animation to output branch
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_branch: output
      publish_dir: ./dist
      force_orphan: true
```
