<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFD43B" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <!-- clip widths tuned to the real line lengths -->
    <clipPath id="clip1"><rect x="80" y="70" width="0" height="28"><animate attributeName="width" values="0;245;245;0" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip2"><rect x="80" y="105" width="0" height="28"><animate attributeName="width" values="0;520;520;0" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip3"><rect x="80" y="140" width="0" height="28"><animate attributeName="width" values="0;200;200;0" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip4"><rect x="80" y="175" width="0" height="28"><animate attributeName="width" values="0;645;645;0" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip5"><rect x="80" y="210" width="0" height="28"><animate attributeName="width" values="0;645;645;0" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip6"><rect x="80" y="245" width="0" height="28"><animate attributeName="width" values="0;485;485;0" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip7"><rect x="80" y="280" width="0" height="28"><animate attributeName="width" values="0;785;785;0" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip8"><rect x="80" y="315" width="0" height="28"><animate attributeName="width" values="0;290;290;0" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#background)"/>
  <rect width="1200" height="430" rx="26" fill="url(#grid)"/>

  <rect x="2" y="2" width="1196" height="426" rx="24" fill="none" stroke="#FFD43B" stroke-opacity="0.45" stroke-width="3">
    <animate attributeName="stroke-opacity" values="0.25;0.75;0.25" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="1075" cy="85" r="120" fill="#FFD43B" opacity="0.03">
    <animate attributeName="r" values="105;135;105" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="165" cy="350" r="95" fill="#FFD43B" opacity="0.02">
    <animate attributeName="cx" values="145;205;145" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="80" y="48" fill="#FFD43B" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="4">
    ABOUT / IDENTITY
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#clip1)">
    <text x="80" y="88" font-family="JetBrains Mono, Consolas, monospace" font-size="19">
      <tspan fill="#FFD43B">name</tspan><tspan fill="#FFFFFF">: </tspan><tspan fill="#FFF4C2">"Jagrat Patel"</tspan><tspan fill="#FFFFFF">,</tspan>
    </text>
  </g>

  <g clip-path="url(#clip2)">
    <text x="80" y="123" font-family="JetBrains Mono, Consolas, monospace" font-size="19">
      <tspan fill="#FFD43B">education</tspan><tspan fill="#FFFFFF">: </tspan><tspan fill="#FFF4C2">"B.S. Information Systems @ UMBC"</tspan><tspan fill="#FFFFFF">,</tspan>
    </text>
  </g>

  <g clip-path="url(#clip3)">
    <text x="80" y="158" font-family="JetBrains Mono, Consolas, monospace" font-size="19">
      <tspan fill="#FFD43B">minor</tspan><tspan fill="#FFFFFF">: </tspan><tspan fill="#FFF4C2">"Finance"</tspan><tspan fill="#FFFFFF">,</tspan>
    </text>
  </g>

  <g clip-path="url(#clip4)">
    <text x="80" y="193" font-family="JetBrains Mono, Consolas, monospace" font-size="19">
      <tspan fill="#FFD43B">currentPosition</tspan><tspan fill="#FFFFFF">: </tspan><tspan fill="#FFF4C2">"IT &amp; Security Intern @ Youphoria LLC"</tspan><tspan fill="#FFFFFF">,</tspan>
    </text>
  </g>

  <g clip-path="url(#clip5)">
    <text x="80" y="228" font-family="JetBrains Mono, Consolas, monospace" font-size="19">
      <tspan fill="#FFD43B">organization</tspan><tspan fill="#FFFFFF">: </tspan><tspan fill="#FFF4C2">"Sponsorship Committee Member @ HackUMBC"</tspan><tspan fill="#FFFFFF">,</tspan>
    </text>
  </g>

  <g clip-path="url(#clip6)">
    <text x="80" y="263" font-family="JetBrains Mono, Consolas, monospace" font-size="19">
      <tspan fill="#FFD43B">achievements</tspan><tspan fill="#FFFFFF">: [</tspan><tspan fill="#FFF4C2">"2× HackUMBC 2025 Winner"</tspan><tspan fill="#FFFFFF">],</tspan>
    </text>
  </g>

  <g clip-path="url(#clip7)">
    <text x="80" y="298" font-family="JetBrains Mono, Consolas, monospace" font-size="19">
      <tspan fill="#FFD43B">awards</tspan><tspan fill="#FFFFFF">: [</tspan><tspan fill="#FFF4C2">"Best Health/Environmental Hack"</tspan><tspan fill="#FFFFFF">, </tspan><tspan fill="#FFF4C2">"MLH Best .Tech Domain"</tspan><tspan fill="#FFFFFF">],</tspan>
    </text>
  </g>

  <g clip-path="url(#clip8)">
    <text x="80" y="333" font-family="JetBrains Mono, Consolas, monospace" font-size="19">
      <tspan fill="#FFD43B">location</tspan><tspan fill="#FFFFFF">: </tspan><tspan fill="#FFF4C2">"Maryland, USA"</tspan>
    </text>
  </g>

  <!-- cursors follow each line and stop exactly at the end -->
  <rect y="74" width="9" height="18" fill="#FFD43B">
    <animate attributeName="x" values="80;320;320;80" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.90;0.999;1" dur="60s" repeatCount="indefinite"/>
  </rect>

  <rect y="109" width="9" height="18" fill="#FFD43B">
    <animate attributeName="x" values="80;595;595;80" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.90;0.999;1" dur="60s" repeatCount="indefinite"/>
  </rect>

  <rect y="144" width="9" height="18" fill="#FFD43B">
    <animate attributeName="x" values="80;274;274;80" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.90;0.999;1" dur="60s" repeatCount="indefinite"/>
  </rect>

  <rect y="179" width="9" height="18" fill="#FFD43B">
    <animate attributeName="x" values="80;721;721;80" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.90;0.999;1" dur="60s" repeatCount="indefinite"/>
  </rect>

  <rect y="214" width="9" height="18" fill="#FFD43B">
    <animate attributeName="x" values="80;721;721;80" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.90;0.999;1" dur="60s" repeatCount="indefinite"/>
  </rect>

  <rect y="249" width="9" height="18" fill="#FFD43B">
    <animate attributeName="x" values="80;560;560;80" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.90;0.999;1" dur="60s" repeatCount="indefinite"/>
  </rect>

  <rect y="284" width="9" height="18" fill="#FFD43B">
    <animate attributeName="x" values="80;858;858;80" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.90;0.999;1" dur="60s" repeatCount="indefinite"/>
  </rect>

  <rect y="319" width="9" height="18" fill="#FFD43B">
    <animate attributeName="x" values="80;366;366;80" keyTimes="0;0.10;0.90;1" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.90;0.999;1" dur="60s" repeatCount="indefinite"/>
  </rect>
</svg>
