<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a7200"/>
      <stop offset="35%" stop-color="#ffd43b"/>
      <stop offset="50%" stop-color="#fff1a8"/>
      <stop offset="65%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#9a7200"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffd43b" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <circle cx="150" cy="100" r="120" fill="#ffd43b" opacity="0.07">
    <animate attributeName="cx" values="150;280;150" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;155;100" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="260" r="150" fill="#ffd43b" opacity="0.05">
    <animate attributeName="cx" values="1050;920;1050" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="260;215;260" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(600 180)">
    <ellipse rx="500" ry="130" fill="none" stroke="#ffd43b" stroke-opacity="0.14" stroke-dasharray="8 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="430" ry="100" fill="none" stroke="#ffd43b" stroke-opacity="0.10" stroke-dasharray="4 16">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g fill="#ffd43b">
    <circle cx="100" cy="180" r="3">
      <animate attributeName="cy" values="180;145;180" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="120" r="3">
      <animate attributeName="cy" values="120;155;120" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="285" r="2">
      <animate attributeName="cy" values="285;250;285" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="280" r="2">
      <animate attributeName="cy" values="280;245;280" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="155" text-anchor="middle" fill="url(#gold)"
        font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800"
        letter-spacing="4" filter="url(#glow)">
    JAGRAT PATEL
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <text x="600" y="210" text-anchor="middle" fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600"
        letter-spacing="2">
    FULL-STACK | IT SECURITY | APPLIED AI
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;1" dur="2.2s" fill="freeze"/>
  </text>

  <text x="600" y="262" text-anchor="middle" fill="#d0d0d0"
        font-family="monospace" font-size="17">
    BUILDING SECURE, USEFUL AND HUMAN-CENTERED PRODUCTS
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="3s" fill="freeze"/>
  </text>

  <rect x="864" y="246" width="10" height="21" rx="1" fill="#ffd43b">
    <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
  </rect>

  <rect x="560" y="310" width="80" height="2" rx="1" fill="#ffd43b">
    <animate attributeName="x" values="560;245;560" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="80;710;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/>
  </rect>

  <rect x="2" y="2" width="1196" height="356" rx="22" fill="none"
        stroke="#ffd43b" stroke-width="3" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
