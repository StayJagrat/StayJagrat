<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360">
      <stop stop-color="#050505"/>
      <stop offset="0.5" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>

    <linearGradient id="gold" x1="250" y1="0" x2="950" y2="0">
      <stop stop-color="#8A6500"/>
      <stop offset="0.25" stop-color="#FFD43B"/>
      <stop offset="0.5" stop-color="#FFF2A8"/>
      <stop offset="0.75" stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#8A6500"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#FFD43B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#FFD43B" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop stop-color="#FFD43B" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFD43B" stop-opacity="0"/>
    </radialGradient>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#FFD43B"
        stroke-width="0.4"
        stroke-opacity="0.12"
      />
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <circle cx="160" cy="100" r="170" fill="url(#glow)" opacity="0.16">
