<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A7200"/>
      <stop offset="40%" stop-color="#FFD43B"/>
      <stop offset="55%" stop-color="#FFF1A8"/>
      <stop offset="70%" stop-color="#FFD43B"/>
      <stop offset="100%" stop-color="#9A7200"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFD43B" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="taglineClip">
      <rect x="255" y="128" width="0" height="28">
        <animate attributeName="width" values="0;690;690;0" keyTimes="0;0.18;0.88;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="210" fill="#0B0B0B"/>
  <rect width="1200" height="210" fill="url(#grid)"/>

  <circle cx="245" cy="62" r="92" fill="#FFD43B" opacity="0.045">
    <animate attributeName="cx" values="230;285;230" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="960" cy="150" r="110" fill="#FFD43B" opacity="0.035">
    <animate attributeName="cx" values="970;900;970" dur="8s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="95" text-anchor="middle" fill="url(#gold)"
        font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800"
        letter-spacing="5" filter="url(#glow)">
    JAGRAT PATEL
    <animate attributeName="opacity" values="0.72;1;0.72" dur="3s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#taglineClip)">
    <text x="600" y="150" text-anchor="middle" fill="#FFFFFF"
          font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="700"
          letter-spacing="2">
      FULL-STACK | IT SECURITY | APPLIED AI
    </text>
  </g>

  <rect y="130" width="10" height="25" fill="#FFD43B">
    <animate attributeName="x" values="255;945;945;255" keyTimes="0;0.18;0.88;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.88;0.99;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <rect x="430" y="180" width="340" height="2" rx="1" fill="#FFD43B" opacity="0.75">
    <animate attributeName="width" values="90;340;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="555;430;555" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg> 
